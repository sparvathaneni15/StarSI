[project]
name = "starsi-train"
version = "0.1.0"
description = "StarSI bare-metal Mac training — MLX LoRA driven over SSH by the Pi pipeline"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.23",
]

# mlx-lm is Apple-Silicon-only; keep it an extra so the uv workspace resolves
# on Linux CI. On the Mac: uv sync --extra mlx
[project.optional-dependencies]
mlx = ["mlx-lm>=0.32"]
dev = ["pytest>=8"]

[project.scripts]
starsi-train = "starsi_train.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starsi_train"]
