[project]
name = "starsi-gateway"
version = "0.1.0"
description = "StarSI gateway block — auth, tier routing, chat SSE proxy, sync forwarding"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starsi_gateway"]
