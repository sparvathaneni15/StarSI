[project]
name = "starsi-model-pipeline"
version = "0.1.0"
description = "StarSI model lifecycle — Pi-side orchestration of fetch/train/package/deploy over SSH"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
starsi-pipeline = "starsi_pipeline.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starsi_pipeline"]
