image:
  repository: ghcr.io/samanyuparvathaneni/starsi-model-pipeline
  tag: latest
  pullPolicy: IfNotPresent

authToken: ""

macSsh: "samanyu@samanyus-macbook-pro.local"
awsSsh: "starsi-admin@aws"      # resolved via the mounted ssh_config/known_hosts
repoDir: "~/Desktop/StarSI"

hfRepo: "Qwen/Qwen2.5-7B-Instruct"
modelName: starsi
s3Bucket: starsi-artifacts
registryUrl: "http://starsi-registry:8080"

# Weekly retrain from fresh memory; suspended until you want it automatic.
# Manual run:  kubectl create job --from=cronjob/starsi-pipeline retrain-1
schedule: "0 3 * * 0"
suspend: true

# Secret with the pipeline's SSH identity. Create it once:
#   kubectl create secret generic starsi-pipeline-ssh \
#     --from-file=id_ed25519=$HOME/.starsi/keys/starsi_pi \
#     --from-file=known_hosts=infra/ssh/known_hosts
sshSecret: starsi-pipeline-ssh
