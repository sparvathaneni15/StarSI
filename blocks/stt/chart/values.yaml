image:
  repository: ghcr.io/speaches-ai/speaches
  tag: latest-cpu
  pullPolicy: IfNotPresent

# distil-small keeps CPU latency ~0.5-1s per utterance; swap for accuracy
whisperModel: Systran/faster-distil-whisper-small.en

service:
  port: 8000        # ClusterIP — only the gateway talks to this

cache:
  size: 10Gi

resources:
  requests: {cpu: "1", memory: 1Gi}
  limits: {memory: 4Gi}
