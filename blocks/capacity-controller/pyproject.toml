[project]
name = "starsi-capacity-controller"
version = "0.1.0"
description = "StarSI capacity controller — starts/stops the EC2 GPU node, idle-stops it"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starsi_capacity"]
