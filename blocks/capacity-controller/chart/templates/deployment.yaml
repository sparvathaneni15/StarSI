apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      containers:
        - name: capacity
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: GPU_INSTANCE_ID
              value: {{ required "gpuInstanceId is required" .Values.gpuInstanceId | quote }}
            - name: AWS_REGION
              value: {{ .Values.region | quote }}
            - name: STARSI_GPU_IDLE_MINUTES
              value: {{ .Values.idleMinutes | quote }}
            - name: STARSI_AUTH_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Release.Name }}-auth, key: token}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 15
          resources: {{- toYaml .Values.resources | nindent 12 }}
