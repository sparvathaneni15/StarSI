apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      nodeSelector: {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- if .Values.model.s3.enabled }}
      initContainers:
        - name: fetch-model
          image: amazon/aws-cli:latest
          env:
            - name: MODEL_VERSION
              value: {{ .Values.model.s3.version | quote }}
          command: ["sh", "-c"]
          args:
            - >
              mkdir -p /models/current &&
              aws s3 cp
              s3://{{ .Values.model.s3.bucket }}/{{ .Values.model.s3.name }}/$(MODEL_VERSION)/model.safetensors.tar
              - | tar -x -C /models/current
          volumeMounts:
            - {name: cache, mountPath: /models, subPath: models}
      {{- end }}
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--model"
            {{- if .Values.model.s3.enabled }}
            - "/models/current"
            {{- else }}
            - {{ .Values.model.hf | quote }}
            {{- end }}
            - "--served-model-name"
            - {{ .Values.model.servedName | quote }}
            - "--max-model-len"
            - {{ .Values.maxModelLen | quote }}
            - "--gpu-memory-utilization"
            - {{ .Values.gpuMemoryUtilization | quote }}
          ports:
            - containerPort: 8000
          volumeMounts:
            - {name: cache, mountPath: /models, subPath: models}
            - {name: cache, mountPath: /root/.cache, subPath: hf-cache}
            - {name: shm, mountPath: /dev/shm}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 60   # model load after a cold node start takes minutes
          resources:
            limits:
              nvidia.com/gpu: 1
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
