name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-packages
      - run: uv run ruff check blocks train
      - run: uv run pytest -q

  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint all block charts
        run: |
          set -e
          for chart in blocks/*/chart; do
            helm lint "$chart" --set authToken=ci --set gpuInstanceId=i-ci
            helm template ci "$chart" --set authToken=ci --set gpuInstanceId=i-ci > /dev/null
          done

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: apps/ios
        run: swift test --scratch-path "$RUNNER_TEMP/starsi-spm"
