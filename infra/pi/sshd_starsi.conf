# StarSI tunnel user: port-forwarding only, no shell, no files.
Match User starsi
    AllowTcpForwarding yes
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin
    # NodePorts the phone/ops may reach on the Pi (gateway, memory, registry)
    PermitOpen 127.0.0.1:30086 127.0.0.1:30084 127.0.0.1:30085
    PermitListen none
