[project]
name = "starsi"
version = "0.1.0"
description = "StarSI — personal multi-device AI assistant: iPhone client, Mac nodes"
requires-python = ">=3.11"
readme = "README.md"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]

[tool.uv.workspace]
members = [
    "blocks/gateway",
    "blocks/memory",
    "blocks/registry",
    "blocks/capacity-controller",
    "blocks/model-pipeline",
    "train",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["blocks"]
