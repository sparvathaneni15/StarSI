# XcodeGen spec. `xcodegen generate` → StarSI.xcodeproj (git-ignored).
name: StarSI
options:
  bundleIdPrefix: com.samanyu.starsi
  deploymentTarget:
    iOS: "18.0"
packages:
  StarSIPackage:
    path: .
targets:
  StarSIApp:
    type: application
    platform: iOS
    sources: [Sources/StarSIApp]
    dependencies:
      - package: StarSIPackage
        product: StarSIClient
      - package: StarSIPackage
        product: StarSIRouter
      - package: StarSIPackage
        product: StarSITunnel
      - package: StarSIPackage
        product: StarSIVoice
      - package: StarSIPackage
        product: StarSITools
    info:
      path: Sources/StarSIApp/Info.plist
      properties:
        NSMicrophoneUsageDescription: "StarSI listens so you can talk to your assistant."
        NSSpeechRecognitionUsageDescription: "StarSI renders what you say as text on-device."
        UIBackgroundModes: [audio]
    settings:
      base:
        SWIFT_STRICT_CONCURRENCY: complete
        DEVELOPMENT_TEAM: SL6XU3QCNY
        CODE_SIGN_STYLE: Automatic
