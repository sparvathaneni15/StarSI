[project]
name = "starsi-hub"
version = "0.0.1"
description = "StarSI inference hub — Mac Studio, always-on, largest models"
requires-python = ">=3.12"
dependencies = ["starsi-core", "starsi-inference[mlx]"]

[project.scripts]
starsi-hub = "starsi_hub.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starsi_hub"]
