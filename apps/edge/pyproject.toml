[project]
name = "starsi-edge"
version = "0.0.1"
description = "StarSI edge node — MacBook Pro, portable inference and fallback"
requires-python = ">=3.12"
dependencies = ["starsi-core", "starsi-inference[mlx]"]

[project.scripts]
starsi-edge = "starsi_edge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starsi_edge"]
