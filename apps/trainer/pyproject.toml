[project]
name = "starsi-trainer"
version = "0.0.1"
description = "StarSI data factory and post-training — beast-pc (RTX 5080, CUDA)"
requires-python = ">=3.12"
dependencies = [
    "starsi-core",
    "httpx>=0.27",
    "pyyaml>=6",
    "datasets>=2.20",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# CUDA-only. Install on beast-pc, nowhere else.
cuda = [
    "torch>=2.4",
    "vllm>=0.6",
    "trl>=0.12",
    "peft>=0.13",
    "unsloth",
    "bitsandbytes>=0.44",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
starsi-generate = "starsi_trainer.generate:main"
starsi-judge = "starsi_trainer.judge:main"
starsi-pairs = "starsi_trainer.pairs:main"
starsi-train = "starsi_trainer.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starsi_trainer"]
