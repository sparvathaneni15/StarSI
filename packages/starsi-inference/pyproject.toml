[project]
name = "starsi-inference"
version = "0.0.1"
description = "Serving layer shared by hub and edge: MLX backend, router, ideation loop, Bonjour advertisement"
requires-python = ">=3.12"
dependencies = [
    "starsi-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# macOS / Apple Silicon only. Not installable on beast-pc.
mlx = ["mlx-lm>=0.20"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starsi_inference"]
