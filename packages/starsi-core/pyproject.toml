[project]
name = "starsi-core"
version = "0.0.1"
description = "Shared types for StarSI: wire protocol, model registry, routing decisions"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["starsi_core"]
